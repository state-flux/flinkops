[package]
name = "flinkops-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP server for FlinkOps: exposes the ops console to AI clients with scoped, audited, approval-gated tools"

[[bin]]
name = "flinkops-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "charset", "rustls-no-provider"] }
flinkops-tls = { version = "0.1.0", path = "../flinkops-tls" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
