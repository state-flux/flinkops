[package]
name = "flinkops-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "flinkops"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.2"
chrono = "0.4.45"
flinkops-core = { version = "0.1.0", path = "../flinkops-core" }
flinkops-flink-rest = { version = "0.1.0", path = "../flinkops-flink-rest" }
flinkops-k8s = { version = "0.1.0", path = "../flinkops-k8s" }
flinkops-store = { version = "0.1.0", path = "../flinkops-store" }
flinkops-types = { version = "0.1.0", path = "../flinkops-types" }
futures = "0.3.34"
hmac = "0.12.1"
http = "1.5.0"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", features = ["json"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
