[package]
name = "flinkops-flink-rest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
flinkops-types = { version = "0.1.0", path = "../flinkops-types" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "charset", "rustls-no-provider"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "time"] }
tracing = "0.1.44"
url = "2.5.9"
