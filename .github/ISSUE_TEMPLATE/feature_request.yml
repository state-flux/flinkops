name: Feature request
description: A capability the console should have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting
      description: Describe the operational situation, not the solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: If it touches an API or a CRD field, say which one.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Job lifecycle (start/stop/restart/savepoint/restore/scale/upgrade)
        - Observability (metrics / Prometheus / alerts)
        - Flink UI proxy
        - MCP / AI access
        - Storage / multi-cluster
        - Web UI
        - Docs
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is not a job-submission or scheduling platform feature request
        - label: I have read docs/data-sources.md (which data may come from where)
