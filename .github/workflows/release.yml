name: release

# 打 tag 即发版：多平台二进制压缩包 + 安装包 + 多架构镜像 + Helm chart，全部挂到同一个 GitHub Release。
#
#   git tag -a v0.1.0 -m "FlinkOps 0.1.0" && git push origin v0.1.0
#
# 产物矩阵（全部由 scripts/dist.py 打包，同一套解包布局）：
#   Linux  x86_64 / arm64   .tar.gz + .deb + .AppImage（均附 .sha256）
#   macOS  x86_64 / arm64   .tar.gz
#   Windows x86_64          .zip（便携）+ setup.exe（NSIS 安装包），均附 .sha256
#   源码   任意平台          src.tar.gz + src.zip（git ls-files 清单）
#   附带 SHA256SUMS.txt、build-info.json、RELEASE_NOTES.md
#
# 所有 action 均为 Node 24 运行时版本；发布说明与附件使用 runner 预装的 gh CLI。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（如 v0.1.0），仅手动触发时需要"
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/flinkops
  CHART_OCI: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  verify:
    name: verify / version + tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: v
        name: resolve version (tag = Cargo.toml = Chart.yaml)
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          case "$REF" in v*) ;; *) REF="v$REF" ;; esac
          VERSION="${REF#v}"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -q '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          CARGO_VER=$(python3 -c "import re,sys;t=open('Cargo.toml').read();m=re.search(r'\[workspace\.package\][^\[]*?version\s*=\s*\"([^\"]+)\"',t,re.S);print(m.group(1) if m else '')")
          CHART_APP=$(awk '/^appVersion:/ {gsub(/"/,"",$2); print $2}' deploy/helm/flinkops/Chart.yaml)
          CHART_VER=$(awk '/^version:/ {print $2}' deploy/helm/flinkops/Chart.yaml)
          WEB_VER=$(python3 -c "import json;print(json.load(open('apps/web/package.json'))['version'])")
          echo "tag=$VERSION cargo=$CARGO_VER chart.version=$CHART_VER chart.appVersion=$CHART_APP web=$WEB_VER"
          for pair in "Cargo.toml:$CARGO_VER" "Chart.yaml(version):$CHART_VER" "Chart.yaml(appVersion):$CHART_APP" "apps/web/package.json:$WEB_VER"; do
            name="${pair%%:*}"; got="${pair##*:}"
            if [ "$VERSION" != "$got" ]; then
              echo "::error::版本不一致：tag=$VERSION 但 $name=$got"
              echo "发版前请把 Cargo.toml / deploy/helm/flinkops/Chart.yaml / apps/web/package.json 全部对齐到 $VERSION"
              exit 1
            fi
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87
      - uses: Swatinem/rust-cache@v2

      - name: tests
        run: cargo test --workspace --all-targets

  dist:
    name: dist / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            formats: tar.gz,deb,appimage
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            formats: tar.gz,deb,appimage
          - runner: macos-13
            target: x86_64-apple-darwin
            formats: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            formats: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            formats: zip,setup
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: web build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html

      - name: install appimage toolchain (linux)
        if: contains(matrix.target, 'linux')
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools
          mksquashfs -version | head -1
          mkdir -p .tools/appimage
          curl -fsSL -o ".tools/appimage/runtime-${{ matrix.arch }}" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/runtime-${{ matrix.arch }}"
          chmod +x ".tools/appimage/runtime-${{ matrix.arch }}"
          test -s ".tools/appimage/runtime-${{ matrix.arch }}"
          ls -l .tools/appimage

      - name: cargo build (release)
        run: >
          cargo build --release --locked --target ${{ matrix.target }} --bins
          -p flinkops-api -p flinkops-cli -p flinkops-mcp

      - name: install NSIS (windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $mk) { $mk = "C:\Program Files (x86)\NSIS\makensis.exe" }
          if (-not (Test-Path $mk)) { throw "makensis 不可用" }
          "MAKENSIS=$mk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
          $PY scripts/dist.py \
            --version "${{ needs.verify.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --bin-dir "target/${{ matrix.target }}/release" \
            --web-dir apps/web/dist \
            --formats "${{ matrix.formats }}" \
            --out dist
          ls -lh dist

      - name: release notes (per-job sanity check)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 scripts/release_notes.py --version "${{ needs.verify.outputs.version }}" --print > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*
            !dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  source:
    name: source / src.tar.gz + src.zip
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: package sources (git ls-files manifest)
        run: |
          set -euo pipefail
          python3 scripts/dist.py \
            --version "${{ needs.verify.outputs.version }}" \
            --commit "${{ github.sha }}" \
            --formats src-tar.gz,src-zip \
            --out dist
          ls -lh dist
          # 清单里不该出现构建产物
          if tar -tzf "dist/flinkops-${{ needs.verify.outputs.version }}-src.tar.gz" \
             | grep -E '/(target|node_modules|dist)/' ; then
            echo "::error::源码包里混入了构建产物"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-source
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  image:
    name: image / buildx push (multi-arch)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}

      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: chart / package + push OCI
    runs-on: ubuntu-latest
    needs: [verify, image]
    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest 自带 helm；缺失时现装
      - name: helm
        run: |
          helm version --short || {
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            helm version --short
          }

      - name: lint + package
        run: |
          helm lint deploy/helm/flinkops
          helm package deploy/helm/flinkops --destination dist
          ls -l dist

      - name: push to ghcr (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push dist/flinkops-${{ needs.verify.outputs.version }}.tgz ${{ env.CHART_OCI }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-helm
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14

  release:
    name: release / notes + checksums + upload
    runs-on: ubuntu-latest
    needs: [verify, dist, source, chart]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: generate notes + authoritative checksums
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py \
            --version "${{ needs.verify.outputs.version }}" \
            --dist dist \
            --out dist/RELEASE_NOTES.md
          rm -f dist/SHA256SUMS.txt
          (cd dist && sha256sum \
            $(ls | grep -vE '^(SHA256SUMS\.txt|RELEASE_NOTES\.md)$|\.sha256$' | sort) > SHA256SUMS.txt)
          echo "== artifacts =="
          ls -lh dist
          echo "== warnings =="
          # 缺平台要让发版失败，而不是静默少产物
          for pat in 'x86_64-unknown-linux-gnu.tar.gz' '_amd64.deb' 'x86_64-unknown-linux-gnu.AppImage' \
                     'aarch64-unknown-linux-gnu.tar.gz' '_arm64.deb' 'aarch64-unknown-linux-gnu.AppImage' \
                     'x86_64-apple-darwin.tar.gz' 'aarch64-apple-darwin.tar.gz' \
                     'x86_64-pc-windows-msvc.zip' 'x86_64-pc-windows-msvc-setup.exe' \
                     '-src.tar.gz' '-src.zip' '.tgz' \
                     'x86_64-unknown-linux-gnu.tar.gz.sha256' 'flinkops_' \
                     '-setup.exe.sha256' '-src.zip.sha256'; do
            if ! ls dist/ | grep -q "$pat"; then
              echo "::error::缺少产物 *${pat}"
              exit 1
            fi
          done

      - name: verify notes cover every artifact
        run: |
          set -euo pipefail
          missing=0
          for f in dist/*; do
            base=$(basename "$f")
            case "$base" in
              SHA256SUMS.txt|RELEASE_NOTES.md|*.sha256|*.build-info.json) continue ;;
            esac
            if ! grep -qF "$base" dist/RELEASE_NOTES.md; then
              echo "::error::发行说明里没有 $base"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "notes 覆盖了全部产物"

      - name: create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; else FLAGS="--latest"; fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "FlinkOps $VERSION" \
              --notes-file dist/RELEASE_NOTES.md $FLAGS
          else
            gh release create "$TAG" dist/* \
              --title "FlinkOps $VERSION" \
              --notes-file dist/RELEASE_NOTES.md \
              --verify-tag $FLAGS
          fi
          gh release view "$TAG" --json url,assets \
            --jq '"release: " + .url + " assets=" + (.assets|length|tostring)'
