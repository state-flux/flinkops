# Apache-2.0 兼容性门禁：CI 里跑 `cargo deny check licenses`
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unlicense", "0BSD",
  "MPL-2.0", "Unicode-3.0", "OpenSSL", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.90

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"